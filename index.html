<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eumae</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E"
    />
    <!-- Appearance is applied here rather than from the bundle: the bundle is a
         deferred script, so a light user would paint the dark default on <html>
         first and then flip. Same `eumae:theme` store Settings writes, which is
         what lets a backup carry it and Delete everything clear it. -->
    <script>
      (function () {
        var raw = null, saved = null;
        try {
          raw = localStorage.getItem('eumae:theme');
          saved = JSON.parse(raw || 'null');
        } catch (e) {
          saved = raw; // a bare, unquoted value: hand-edited, or from before this was JSON
        }
        if (saved !== 'light' && saved !== 'dark') {
          try {
            saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e2) {
            saved = 'dark';
          }
        }
        document.documentElement.dataset.theme = saved;
        /* The bare-HTML background matches the resolved theme, so a light
           user never gets the old one-dark-frame flash: this runs before
           first paint, and the stylesheet's own rule agrees. */
        document.documentElement.style.background = saved === 'light' ? '#f2f2f7' : '#000';
      })();
    </script>
    <!-- Critical paint: the hashed stylesheet is cache-immutable, but on a
         dead connection it may still miss — these rules mean the app can
         never appear naked. Theme-aware background, the shell column, the
         base face: plain, but dressed. The full stylesheet replaces all of
         this when it lands. Keep minimal or it rots. -->
    <style>
      html{background:#000}
      html[data-theme="light"]{background:#f2f2f7}
      body{margin:0;background:#000;color:#fff;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
      html[data-theme="light"] body{background:#f2f2f7;color:#000}
      #root{height:100%}
      #app{display:flex;min-height:100dvh}
      #app .col{flex:1;min-width:0;display:flex;flex-direction:column}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
