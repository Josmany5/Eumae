name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Every check:* script, read from package.json — not a hand-kept list of
      # 14 of 25, which is how three of them rotted red for months
      # (STANDARD.md 3.5). Checks that need a key exit 2 and report as SKIP.
      - run: npm run check:all
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
