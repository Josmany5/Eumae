name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:chat
      - run: npm run check:chat:selftest
      - run: npm run check:chat-md
      - run: npm run check:chat-md:selftest
      - run: npm run check:boot
      - run: npm run check:models:selftest
      - run: npm run check:voice
      - run: npm run check:voice:selftest
